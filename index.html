<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>koimidi — free piano trainer</title>
<meta name="description" content="Free piano trainer for MIDI keyboards in the browser: falling notes with finger numbers, waits for the right key, built-in sound. No sign-up, files never leave your browser.">
<meta name="theme-color" content="#04111d">
<meta property="og:title" content="koimidi — free piano trainer">
<meta property="og:description" content="Falling notes with finger numbers for your MIDI keyboard. Free, no sign-up, files stay in your browser.">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="koimidi">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<!-- ===== Home ===== -->
<section id="home" class="screen home">
  <header class="home-top">
    <a class="brand" href="./" aria-label="koimidi">koi<span class="dot">·</span>midi</a>
    <nav class="home-nav">
      <button id="installBtn" type="button" class="ghost" data-i18n="install" data-i18n-title="install.title" hidden></button>
      <button id="langToggle" type="button" class="ghost" aria-label="Language">EN</button>
      <a class="ghost link" href="https://github.com/MeRuslan/koimidi" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </header>

  <main class="home-main">
    <section class="hero">
      <h1 data-i18n="app.tagline"></h1>
      <p class="sub" data-i18n="app.sub"></p>
      <ul class="facts">
        <li data-i18n="facts.free"></li>
        <li data-i18n="facts.noSignup"></li>
        <li data-i18n="facts.local"></li>
      </ul>
      <div class="open">
        <button id="openBtn" type="button" class="primary big">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v3h16v-3"/><path d="M12 4v12"/><path d="m7 9 5-5 5 5"/></svg>
          <span data-i18n="open.button"></span>
        </button>
        <span class="drop-hint" data-i18n="open.drop"></span>
      </div>
      <p class="fine" data-i18n="open.formats"></p>
      <p id="homeMidi" class="status-line"></p>
      <p id="browserHint" class="fine warn" data-i18n="browser.hint" hidden></p>
    </section>

    <section id="recent" class="block" hidden>
      <h2 data-i18n="recent.title"></h2>
      <ul id="recentList" class="list"></ul>
      <p class="fine" data-i18n="recent.note"></p>
    </section>

    <section class="block">
      <h2 data-i18n="library.title"></h2>
      <ul id="libraryList" class="cards"></ul>
      <p class="fine" data-i18n="library.note"></p>
    </section>
  </main>

  <footer class="home-foot">
    <span data-i18n="footer.privacy"></span>
    <span class="sep">·</span>
    <a href="https://github.com/MeRuslan/koimidi" target="_blank" rel="noopener" data-i18n="footer.source"></a>
    <span class="sep">·</span>
    <a href="https://github.com/MeRuslan/koimidi/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="footer.license"></a>
    <span class="sep">·</span>
    <span id="version"></span>
  </footer>
</section>

<!-- ===== Practice ===== -->
<section id="practice" class="screen practice" hidden>
  <header class="bar">
    <button id="back" type="button" class="ghost icon-btn" data-i18n-title="back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="piece">
      <b id="pieceTitle"></b>
      <small id="pieceComposer"></small>
    </div>
    <button id="play" type="button" class="primary"></button>
    <button id="restart" type="button" class="icon-btn" data-i18n-title="restart">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
    <button id="rec" type="button" class="icon-btn rec-btn" data-i18n-title="record" aria-pressed="false">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>
      <span id="recTime" class="rec-time" hidden></span>
    </button>
    <div class="seg" role="radiogroup" aria-label="Mode">
      <label><input type="radio" name="mode" value="learn"><span data-i18n="mode.learn"></span></label>
      <label><input type="radio" name="mode" value="tempo"><span data-i18n="mode.tempo"></span></label>
      <label><input type="radio" name="mode" value="listen"><span data-i18n="mode.listen"></span></label>
    </div>
    <button id="metro" type="button" class="icon-btn toggle-btn" data-i18n-title="metronome" aria-pressed="false" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6l4 18H5L9 3z"/><path d="M7.5 15h9"/><path d="M12 15l5-9"/></svg>
    </button>
    <div class="group tempo">
      <span class="label" data-i18n="tempo"></span>
      <input id="tempo" type="range" min="20" max="100" step="5" value="50" aria-label="Tempo">
      <span id="tempoVal" class="val"></span>
    </div>
    <div class="seg hands" id="hands" role="radiogroup" aria-label="Hand" hidden>
      <label><input type="radio" name="hand" value="R"><span data-i18n="hand.R"></span></label>
      <label><input type="radio" name="hand" value="L"><span data-i18n="hand.L"></span></label>
      <label><input type="radio" name="hand" value="both"><span data-i18n="hand.both"></span></label>
    </div>
    <label class="toggle" id="accompRow" data-i18n-title="accomp.title" hidden><input type="checkbox" id="accomp"><span data-i18n="accomp"></span></label>
    <div class="group range">
      <span class="label" data-i18n="bars"></span>
      <input id="rangeFrom" type="number" min="1" step="1" inputmode="numeric" aria-label="From bar">
      <span class="dash">–</span>
      <input id="rangeTo" type="number" min="1" step="1" inputmode="numeric" aria-label="To bar">
      <button id="rangeAll" type="button" class="ghost small" data-i18n="bars.all"></button>
      <label class="toggle"><input type="checkbox" id="loop"><span data-i18n="loop"></span></label>
    </div>
    <div class="spacer"></div>
    <button id="progressBtn" type="button" class="icon-btn" data-i18n-title="progress" aria-haspopup="dialog" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
    </button>
    <button id="settingsBtn" type="button" class="icon-btn" data-i18n-title="settings" aria-haspopup="dialog" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <span id="midi" class="status"></span>
  </header>
  <div id="sectionsRow" class="sections" hidden>
    <span class="label" data-i18n="sections"></span>
    <div id="sections" class="chips"></div>
  </div>
  <div id="takeRow" class="take" role="status" hidden>
    <span class="rec-dot" aria-hidden="true"></span>
    <span id="takeText" class="take-text"></span>
    <button id="takeStop" type="button" class="small" data-i18n="take.stop"></button>
    <button id="takePlay" type="button" class="small"></button>
    <button id="takeSave" type="button" class="primary small" data-i18n="take.save"></button>
    <button id="takeDiscard" type="button" class="ghost small" data-i18n="take.discard"></button>
  </div>

  <main class="stage-wrap">
    <canvas id="stage" aria-label="Falling notes and keyboard"></canvas>
    <div class="hud">
      <div id="next" class="next"></div>
      <div id="stats" class="stats"></div>
    </div>
    <div id="hint" class="hint" hidden></div>

    <div id="picker" class="picker" role="dialog" hidden>
      <div class="picker-head"><b id="pickerNote"></b><span id="pickerSrc"></span></div>
      <div id="pickerFingers" class="picker-fingers"></div>
      <div class="picker-foot">
        <button id="pickerReset" type="button" class="ghost small" data-i18n="picker.reset"></button>
        <span class="fine" data-i18n="picker.keys"></span>
      </div>
    </div>

    <div id="progress" class="popover progress" role="dialog" aria-label="Progress" hidden></div>

    <div id="settings" class="popover" role="dialog" aria-label="Settings" hidden>
      <div class="sect" data-i18n="settings.sect.piece"></div>
      <div class="actions">
        <button id="exportXml" type="button" class="small" data-i18n="settings.export"></button>
        <button id="resetFingers" type="button" class="ghost small"></button>
        <button id="resetPiece" type="button" class="ghost small" data-i18n="settings.reset"></button>
      </div>
      <label class="row" id="midiSplitRow"><span data-i18n="settings.midiSplit"></span>
        <select id="midiSplit">
          <option value="auto" data-i18n="settings.midiSplit.auto"></option>
          <option value="none" data-i18n="settings.midiSplit.none"></option>
          <option value="middleC" data-i18n="settings.midiSplit.middleC"></option>
        </select>
      </label>
      <div class="sect" data-i18n="settings.sect.sound"></div>
      <label class="row"><span data-i18n="settings.instrument"></span><select id="instrument"></select></label>
      <p id="instrumentNote" class="row-note" hidden></p>
      <label class="row" id="patchRow" hidden><span data-i18n="sound.patch"></span><select id="patch"></select></label>
      <div class="actions" id="packActions" hidden><button id="removePack" type="button" class="ghost small" data-i18n="sound.remove"></button></div>
      <input id="packFile" type="file" accept=".sf2,.sf3" hidden>
      <label class="row"><input type="checkbox" id="sound"><span data-i18n="settings.sound"></span></label>
      <label class="row"><span data-i18n="settings.volume"></span><input id="volume" type="range" min="0" max="1" step="0.05"></label>
      <label class="row"><input type="checkbox" id="countIn"><span data-i18n="settings.countIn"></span></label>
      <div class="sect" data-i18n="settings.sect.keyboard"></div>
      <label class="row"><span data-i18n="settings.keyboard"></span>
        <select id="keyboard"></select>
      </label>
      <label class="row"><input type="checkbox" id="anyOct"><span data-i18n="settings.anyOctave"></span></label>
      <div class="sect" data-i18n="settings.sect.display"></div>
      <label class="row"><span data-i18n="settings.noteNames"></span>
        <select id="noteNames">
          <option value="auto" data-i18n="settings.noteNames.auto"></option>
          <option value="solfege" data-i18n="settings.noteNames.solfege"></option>
          <option value="letters" data-i18n="settings.noteNames.letters"></option>
        </select>
      </label>
      <label class="row"><span data-i18n="settings.lang"></span>
        <select id="lang">
          <option value="en">English</option>
          <option value="ru">Русский</option>
        </select>
      </label>
    </div>
  </main>

  <footer class="legend">
    <span class="fl"><i style="background:#ff8a6b">1</i><span data-i18n="finger.1"></span></span>
    <span class="fl"><i style="background:#ffcf5a">2</i><span data-i18n="finger.2"></span></span>
    <span class="fl"><i style="background:#48d6c6">3</i><span data-i18n="finger.3"></span></span>
    <span class="fl"><i style="background:#8ea8ff">4</i><span data-i18n="finger.4"></span></span>
    <span class="fl"><i style="background:#e590ff">5</i><span data-i18n="finger.5"></span></span>
    <span id="legendLeft" class="fl dim" data-i18n="legend.left" hidden></span>
    <span id="legendAcc" class="fl dim" data-i18n="legend.acc" hidden></span>
    <span class="fl edit" data-i18n="legend.edit"></span>
    <span class="keys" data-i18n="shortcuts"></span>
  </footer>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="dropOverlay" class="drop-overlay" hidden><div data-i18n="open.button"></div></div>
<input id="file" type="file" accept=".mid,.midi,.xml,.musicxml,.mxl,audio/midi,audio/x-midi,application/vnd.recordare.musicxml+xml,application/vnd.recordare.musicxml" hidden>
</body>
</html>
